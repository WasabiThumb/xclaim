name: XClaim
version: '2.0.0'
main: io.github.wasabithumb.xclaim.XClaimPlugin
api-version: 1.18
prefix: XC
authors: [ WasabiThumbs ]
softdepend:
  - ClaimChunk
  - dynmap
  - Essentials
  - EssentialsX
  - Vault
  - NBTAPI
  - BlueMap
  - WorldGuard
  - PlaceholderAPI
description: A fully-featured chunk claiming system for community servers
website: https://wasabi.codes/
folia-supported: true
permissions:
  xclaim.admin:
    description: Allows you to modify/delete any claim
    default: false
commands:
  xclaim:
    description: XClaim main command
    aliases: [ xc ]
